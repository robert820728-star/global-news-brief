name: Apply bounded rc16 operational closure

on:
  push:
    branches:
      - rc16-operational-closure

permissions:
  contents: write

concurrency:
  group: rc16-operational-closure
  cancel-in-progress: false

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rc16-operational-closure
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply bounded source changes
        run: |
          sed -i 's/A mobile-native run completes/mobile-native run completes/g' .github/rc16_patch.py
          python3 -c 'from pathlib import Path; p=Path(".github/rc16_patch.py"); s=p.read_text(); old="    candidates = [(old, new), (old.replace(\"\\n\", \"\\r\\n\"), new.replace(\"\\n\", \"\\r\\n\"))]\n"; new="    candidates = [(old, new)]\n    crlf_old = old.replace(\"\\n\", \"\\r\\n\")\n    if crlf_old != old:\n        candidates.append((crlf_old, new.replace(\"\\n\", \"\\r\\n\")))\n"; assert old in s; p.write_text(s.replace(old, new, 1))'
          python3 .github/rc16_patch.py

      - name: Verify bounded diff and tests
        run: |
          git diff --check
          python3 -m unittest tests.test_mobile_pristine_reservation -v
          python3 -m unittest discover -s tests -v

      - name: Commit source changes and remove temporary patch machinery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/rc16-apply.yml .github/rc16_patch.py
          git add scripts/manage_mobile_run_log.py tests/test_mobile_pristine_reservation.py bootstrap-workspace.md INSTALL.md README.md mobile-chatgpt-daily-prompt.md docs/mobile-run-ledger.md mobile-chatgpt-start-prompt.md .github/workflows/prepare-mobile-run-ledger.yml VERSION-RECORD.md
          git commit -m "Close adhoc occurrence and mobile authority gaps"
          git push origin HEAD:rc16-operational-closure
