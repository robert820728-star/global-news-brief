name: Finalize bounded rc16

on:
  push:
    branches:
      - rc16-operational-closure
    paths:
      - '.github/workflows/rc16-finalize.yml'

permissions:
  contents: write

concurrency:
  group: rc16-finalize-once
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rc16-operational-closure
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply bounded rc16 source patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/rc16_patch.py')
          s = p.read_text(encoding='utf-8').replace('A mobile-native run completes','mobile-native run completes')
          old='    candidates = [(old, new), (old.replace("\\n", "\\r\\n"), new.replace("\\n", "\\r\\n"))]\n'
          if old in s:
              new='    candidates = [(old, new)]\n    crlf_old = old.replace("\\n", "\\r\\n")\n    if crlf_old != old:\n        candidates.append((crlf_old, new.replace("\\n", "\\r\\n")))\n'
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8',newline='\n')
          compile(s,str(p),'exec')
          PY
          python3 .github/rc16_patch.py
          python3 .github/rc16_refine.py
      - name: Rebase validated source diff onto current main
        run: |
          git fetch origin main
          # The watchdog executable bytes are already correct; keep the current main workflow
          # unchanged because this GitHub App lacks workflows permission.
          git checkout origin/main -- .github/workflows/prepare-mobile-run-ledger.yml
          git -c core.whitespace=cr-at-eol diff --check origin/main -- scripts/manage_mobile_run_log.py tests/test_mobile_pristine_reservation.py tests/test_news_run_checkpoint.py tests/test_pipeline_contract.py bootstrap-workspace.md INSTALL.md README.md mobile-chatgpt-daily-prompt.md docs/mobile-run-ledger.md mobile-chatgpt-start-prompt.md VERSION-RECORD.md
          git diff --binary origin/main -- scripts/manage_mobile_run_log.py tests/test_mobile_pristine_reservation.py tests/test_news_run_checkpoint.py tests/test_pipeline_contract.py bootstrap-workspace.md INSTALL.md README.md mobile-chatgpt-daily-prompt.md docs/mobile-run-ledger.md mobile-chatgpt-start-prompt.md VERSION-RECORD.md > /tmp/rc16.patch
          git reset --hard origin/main
          git clean -fd
          git apply --index /tmp/rc16.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Close adhoc occurrence and mobile authority gaps"
      - name: Install release dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          python3 -m pip install --disable-pip-version-check pillow
      - name: Build temporary capsule and verify full suite
        run: |
          source_sha="$(git rev-parse HEAD)"
          python3 scripts/build_bootstrap_capsule.py --source-commit "$source_sha"
          python3 scripts/verify_bootstrap_capsule.py
          python3 -m unittest tests.test_mobile_pristine_reservation -v
          python3 -m unittest discover -s tests -v
      - name: Push verified fast-forward source to main
        run: |
          git reset --hard HEAD
          git push origin HEAD:main
