name: Build bootstrap capsule

on:
  push:
    branches: [main]
    paths-ignore:
      - 'bootstrap/capsule-manifest.json'
      - 'bootstrap/capsule-payload.tar.xz'
      - 'bootstrap/capsule.part*.txt'

permissions:
  contents: write

jobs:
  build-capsule:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime probe dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          python3 -m pip install --disable-pip-version-check pillow

      - name: Compile bootstrap programs
        run: |
          python3 -m py_compile \
            bootstrap/bootstrap_loader.py \
            bootstrap/bootstrap_progress.py \
            scripts/build_bootstrap_capsule.py \
            scripts/verify_bootstrap_capsule.py \
            scripts/news_run_checkpoint.py \
            scripts/resolve_bundled_python.py \
            scripts/fetch_source_routes.py

      - name: Build deterministic capsule
        run: python3 scripts/build_bootstrap_capsule.py --source-commit "$GITHUB_SHA"

      - name: Verify capsule against checkout
        run: python3 scripts/verify_bootstrap_capsule.py

      - name: Focused bootstrap tests
        run: |
          python3 -m unittest \
            tests/test_workspace_python_resolver.py \
            tests/test_source_route_fetcher.py \
            tests/test_bootstrap_progress.py \
            tests/test_bootstrap_capsule.py \
            tests/test_news_run_checkpoint.py \
            tests/test_pipeline_contract.py \
            tests/test_render_base_maps.py \
            -v

      - name: Remove transient Python caches
        run: find . -type d -name __pycache__ -prune -exec rm -rf {} +

      - name: Commit generated capsule
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bootstrap/capsule-manifest.json
          git add bootstrap/capsule-payload.tar.xz
          git add bootstrap/capsule.part*.txt
          if git diff --cached --quiet; then
            echo "No capsule changes to commit"
            exit 0
          fi
          git commit -m "Build verified bootstrap capsule"
          git push origin HEAD:main
