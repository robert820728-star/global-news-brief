name: Build bootstrap capsule

on:
  push:
    branches: [main]
    paths-ignore:
      - 'bootstrap/capsule-manifest.json'
      - 'bootstrap/capsule.part*.txt'

permissions:
  contents: write

jobs:
  build-capsule:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Apply checkpoint capsule migration
        run: python3 scripts/apply_bootstrap_capsule_migration.py

      - name: Compile bootstrap programs
        run: |
          python3 -m py_compile \
            bootstrap/bootstrap_loader.py \
            scripts/build_bootstrap_capsule.py \
            scripts/verify_bootstrap_capsule.py \
            scripts/apply_bootstrap_capsule_migration.py \
            scripts/news_run_checkpoint.py

      - name: Build deterministic capsule
        run: python3 scripts/build_bootstrap_capsule.py --source-commit "$GITHUB_SHA"

      - name: Verify capsule against checkout
        run: python3 scripts/verify_bootstrap_capsule.py

      - name: Focused bootstrap tests
        run: python3 -m unittest tests/test_bootstrap_capsule.py tests/test_news_run_checkpoint.py -v

      - name: Commit generated capsule
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/news_run_checkpoint.py
          git add -A bootstrap
          if git diff --cached --quiet; then
            echo "No capsule changes to commit"
            exit 0
          fi
          git commit -m "Build verified bootstrap capsule"
          git push origin HEAD:main
