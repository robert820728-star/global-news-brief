name: Apply mobile gate hardening

on:
  push:
    branches:
      - hardening/mobile-gate-assertions-20260829
    paths:
      - '.github/workflows/apply-mobile-gate-hardening.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: hardening/mobile-gate-assertions-20260829

      - name: Apply contract migration
        shell: bash
        run: |
          python3 - <<'PY'
          from __future__ import annotations
          import json
          import re
          from pathlib import Path

          ROOT = Path('.')
          GATE_IDS = [
              'RUN_INPUT_NORMALIZATION_GATE',
              'DISCOVERY_THEN_VERIFY',
              'REGIONAL_SUPPLEMENT_COMPLETE_MODEL_ADMISSION_GATE',
              'MOBILE_STRUCTURAL_ADMISSION_EQUIVALENT',
              'GLOBAL_SECTION_PRIMARY_DISCOVERY_GATE',
              'PIPELINE_COUNT_RECEIPT',
              'COUNT_RECEIPT_REPAIR_ONCE',
              'SEMANTIC_EVENT_LEDGER_GATE',
              'EVENT_REGION_AND_TIME_IDENTITY_GATE',
              'POLICY_GOVERNANCE_EVIDENCE_GATE',
              'PUBLIC_VALUE_V2_NORMALIZED_WEIGHTED_SCORING',
              'CATEGORY_APPROPRIATE_EVIDENCE_ROUTE',
              'SAME_SOURCE_RECOVERY_ORDER',
              'MOBILE_NATIVE_IMAGE_EVIDENCE_ROUTE',
              'MOBILE_PER_STORY_VISIBLE_IMAGE_GATE',
              'DIRECT_ARTICLE_MEDIA_DELIVERY_ROUTE',
              'IMAGE_FALLBACK_EXHAUSTION_GATE',
              'IMAGE_READER_VISIBLE_DELIVERY_GATE',
              'NATIVE_MEDIA_CAPABILITY_FALLBACK',
              'MOBILE_READER_STRUCTURE_EQUIVALENT',
              'CANONICAL_THREE_PART_READER_LAYOUT_GATE',
              'MANDATORY_GATE_EXECUTION_ASSERTION',
          ]
          IMAGE_GATE_IDS = {
              'MOBILE_NATIVE_IMAGE_EVIDENCE_ROUTE',
              'MOBILE_PER_STORY_VISIBLE_IMAGE_GATE',
              'DIRECT_ARTICLE_MEDIA_DELIVERY_ROUTE',
              'IMAGE_FALLBACK_EXHAUSTION_GATE',
              'IMAGE_READER_VISIBLE_DELIVERY_GATE',
              'NATIVE_MEDIA_CAPABILITY_FALLBACK',
          }

          def read(path: str) -> str:
              return (ROOT / path).read_text(encoding='utf-8')

          def write(path: str, text: str) -> None:
              (ROOT / path).write_text(text, encoding='utf-8', newline='\n')

          def replace_once(path: str, old: str, new: str) -> None:
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}: {old[:120]!r}')
              write(path, text.replace(old, new, 1))

          # 1) Machine-readable gate assertion schema.
          gate_schema = {
              '$schema': 'https://json-schema.org/draft/2020-12/schema',
              '$id': 'https://github.com/robert820728-star/global-news-brief/schemas/mobile-gate-assertions.schema.json',
              'title': 'Mobile mandatory gate assertions',
              'type': 'object',
              'additionalProperties': False,
              'required': [
                  'schema_version', 'execution_mode', 'run_id', 'main_sha', 'window',
                  'authority_snapshot', 'assertions'
              ],
              'properties': {
                  'schema_version': {'const': '1.0.0'},
                  'execution_mode': {'const': 'mobile-native'},
                  'run_id': {'type': 'string', 'pattern': '^gnb-[0-9]{8}T[0-9]{6}Z-[0-9a-f]{8}$'},
                  'main_sha': {'type': 'string', 'pattern': '^[0-9a-f]{40}$'},
                  'window': {
                      'type': 'object', 'additionalProperties': False,
                      'required': ['start', 'end', 'timezone'],
                      'properties': {
                          'start': {'type': 'string', 'format': 'date-time'},
                          'end': {'type': 'string', 'format': 'date-time'},
                          'timezone': {'type': 'string', 'minLength': 1},
                      },
                  },
                  'authority_snapshot': {
                      'type': 'array', 'minItems': 4, 'uniqueItems': True,
                      'items': {
                          'type': 'object', 'additionalProperties': False,
                          'required': ['path', 'blob_sha'],
                          'properties': {
                              'path': {'type': 'string', 'minLength': 1},
                              'blob_sha': {'type': 'string', 'pattern': '^[0-9a-f]{40}$'},
                          },
                      },
                  },
                  'assertions': {
                      'type': 'array', 'minItems': len(GATE_IDS), 'maxItems': len(GATE_IDS),
                      'items': {
                          'type': 'object', 'additionalProperties': False,
                          'required': [
                              'contract_id', 'status', 'authority_path', 'authority_blob_sha',
                              'evidence_refs', 'checked_at'
                          ],
                          'properties': {
                              'contract_id': {'enum': GATE_IDS},
                              'status': {'enum': ['passed', 'not_applicable', 'blocked']},
                              'authority_path': {'type': 'string', 'minLength': 1},
                              'authority_blob_sha': {'type': 'string', 'pattern': '^[0-9a-f]{40}$'},
                              'evidence_refs': {
                                  'type': 'array', 'minItems': 1,
                                  'items': {'type': 'string', 'minLength': 1},
                              },
                              'checked_at': {'type': 'string', 'format': 'date-time'},
                              'applicability_rationale': {'type': 'string', 'minLength': 1},
                          },
                      },
                  },
              },
          }
          (ROOT / 'schemas/mobile-gate-assertions.schema.json').write_text(
              json.dumps(gate_schema, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )

          # 2) Extend the mobile run-log schema without creating a parallel state machine.
          run_schema_path = ROOT / 'schemas/mobile-run-log.schema.json'
          run_schema = json.loads(run_schema_path.read_text(encoding='utf-8'))
          if run_schema['properties']['schema_version'].get('const') != '1.6.0':
              raise SystemExit('unexpected mobile-run-log schema baseline')
          run_schema['properties']['schema_version']['const'] = '1.7.0'
          required = run_schema['required']
          if 'gate_assertions_artifact' in required:
              raise SystemExit('gate_assertions_artifact already present unexpectedly')
          insert_at = required.index('image_evidence_artifact') + 1
          required.insert(insert_at, 'gate_assertions_artifact')
          run_schema['properties']['gate_assertions_artifact'] = {
              'oneOf': [
                  {'type': 'null'},
                  {
                      'type': 'object', 'additionalProperties': False,
                      'required': ['branch', 'path', 'blob_sha', 'run_id', 'main_sha', 'window'],
                      'properties': {
                          'branch': {'const': 'run-logs'},
                          'path': {
                              'type': 'string',
                              'pattern': '^logs/runs/gnb-[0-9]{8}T[0-9]{6}Z-[0-9a-f]{8}/gate-assertions\\.json$'
                          },
                          'blob_sha': {'type': 'string', 'pattern': '^[0-9a-f]{40}$'},
                          'run_id': {'type': 'string', 'pattern': '^gnb-[0-9]{8}T[0-9]{6}Z-[0-9a-f]{8}$'},
                          'main_sha': {'type': 'string', 'pattern': '^[0-9a-f]{40}$'},
                          'window': {'$ref': '#/properties/window/oneOf/1'},
                      },
                  },
              ]
          }
          run_schema_path.write_text(json.dumps(run_schema, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # 3) Harden manage_mobile_run_log.py: the reader boundary now validates the gate coverage artifact.
          p = 'scripts/manage_mobile_run_log.py'
          replace_once(p, 'SCHEMA_VERSION = "1.6.0"', 'SCHEMA_VERSION = "1.7.0"')
          replace_once(
              p,
              'KNOWN_CAPABILITY_LIMITATIONS = {"NATIVE_MEDIA_UNAVAILABLE"}\nIMAGE_FALLBACK_ATTEMPT_FIELDS = (',
              'KNOWN_CAPABILITY_LIMITATIONS = {"NATIVE_MEDIA_UNAVAILABLE"}\n'
              'REQUIRED_MOBILE_GATE_IDS = (\n' + ''.join(f'    "{item}",\n' for item in GATE_IDS) + ')\n'
              'IMAGE_GATE_ASSERTION_IDS = {\n' + ''.join(f'    "{item}",\n' for item in sorted(IMAGE_GATE_IDS)) + '}\n'
              'REQUIRED_GATE_AUTHORITY_PATHS = {\n'
              '    "INSTALL.md",\n'
              '    "mobile-chatgpt-daily-prompt.md",\n'
              '    ".agents/skills/daily-news-brief/SKILL.md",\n'
              '    "schemas/mobile-run-log.schema.json",\n'
              '}\n'
              'IMAGE_FALLBACK_ATTEMPT_FIELDS = ('
          )
          replace_once(
              p,
              '        "image_evidence_artifact",\n        "durable_audit_status",',
              '        "image_evidence_artifact",\n        "gate_assertions_artifact",\n        "durable_audit_status",'
          )
          replace_once(
              p,
              '        ("image_evidence_artifact", "visuals-completed", "image evidence artifact"),\n        ("reader_artifact", "reader-rendered", "reader artifact"),',
              '        ("image_evidence_artifact", "visuals-completed", "image evidence artifact"),\n'
              '        ("gate_assertions_artifact", "reader-rendered", "gate assertions artifact"),\n'
              '        ("reader_artifact", "reader-rendered", "reader artifact"),'
          )
          replace_once(
              p,
              '            _require_run_artifact(\n                record,\n                "image_evidence_artifact",\n                "image-evidence.json",\n                "image evidence artifact",\n            )\n        if record["stage_index"] >= STAGE_INDEX["github-result-saved"]:',
              '            _require_run_artifact(\n                record,\n                "image_evidence_artifact",\n                "image-evidence.json",\n                "image evidence artifact",\n            )\n'
              '            _require_run_artifact(\n'
              '                record,\n'
              '                "gate_assertions_artifact",\n'
              '                "gate-assertions.json",\n'
              '                "gate assertions artifact",\n'
              '            )\n'
              '        if record["stage_index"] >= STAGE_INDEX["github-result-saved"]:'
          )
          replace_once(
              p,
              '        "image_evidence_artifact": None,\n        "durable_audit_status": "not_started",',
              '        "image_evidence_artifact": None,\n        "gate_assertions_artifact": None,\n        "durable_audit_status": "not_started",'
          )
          replace_once(
              p,
              '    image_evidence_artifact: dict[str, str] | None = None,\n    durable_audit_status: str | None = None,',
              '    image_evidence_artifact: dict[str, str] | None = None,\n'
              '    gate_assertions_artifact: dict[str, str] | None = None,\n'
              '    durable_audit_status: str | None = None,'
          )
          replace_once(
              p,
              '    if image_evidence_artifact is not None:\n        current["image_evidence_artifact"] = image_evidence_artifact\n    if durable_audit_status is not None:',
              '    if image_evidence_artifact is not None:\n        current["image_evidence_artifact"] = image_evidence_artifact\n'
              '    if gate_assertions_artifact is not None:\n        current["gate_assertions_artifact"] = gate_assertions_artifact\n'
              '    if durable_audit_status is not None:'
          )
          validator = '''\n\ndef _validate_bound_gate_assertions(\n    ledger_dir: Path | str, record: dict[str, Any]\n) -> None:\n    if record.get("execution_mode") != "mobile-native":\n        return\n    artifact = record.get("gate_assertions_artifact")\n    if not isinstance(artifact, dict):\n        return\n    path = _bound_artifact_path(Path(ledger_dir), artifact, "gate assertions")\n    if not path.is_file():\n        raise ValueError("bound gate assertions file is missing")\n    try:\n        value = json.loads(path.read_text(encoding="utf-8"))\n    except (OSError, json.JSONDecodeError) as error:\n        raise ValueError("bound gate assertions are not readable JSON") from error\n    if not isinstance(value, dict) or value.get("schema_version") != "1.0.0":\n        raise ValueError("bound gate assertions use an unsupported schema")\n    if value.get("execution_mode") != "mobile-native":\n        raise ValueError("bound gate assertions require mobile-native execution_mode")\n    if value.get("run_id") != record["run_id"] or value.get("main_sha") != record["main_sha"]:\n        raise ValueError("bound gate assertions identity does not match the current run")\n    _validate_window(value.get("window"), "gate assertions")\n    if value.get("window") != record["window"]:\n        raise ValueError("bound gate assertions window does not match the ledger")\n\n    snapshot = value.get("authority_snapshot")\n    if not isinstance(snapshot, list):\n        raise ValueError("gate assertions require authority_snapshot")\n    authority_by_path: dict[str, str] = {}\n    for item in snapshot:\n        if not isinstance(item, dict) or set(item) != {"path", "blob_sha"}:\n            raise ValueError("gate authority snapshot item is invalid")\n        authority_path = item.get("path")\n        blob_sha = item.get("blob_sha")\n        if (\n            not isinstance(authority_path, str)\n            or not authority_path\n            or authority_path in authority_by_path\n            or not isinstance(blob_sha, str)\n            or len(blob_sha) != 40\n            or any(character not in "0123456789abcdef" for character in blob_sha)\n        ):\n            raise ValueError("gate authority snapshot identity is invalid")\n        authority_by_path[authority_path] = blob_sha\n    missing_authorities = REQUIRED_GATE_AUTHORITY_PATHS.difference(authority_by_path)\n    if missing_authorities:\n        raise ValueError(\n            "gate assertions are missing authority snapshots: "\n            + ", ".join(sorted(missing_authorities))\n        )\n\n    assertions = value.get("assertions")\n    if not isinstance(assertions, list):\n        raise ValueError("gate assertions require assertions array")\n    assertions_by_id: dict[str, dict[str, Any]] = {}\n    for item in assertions:\n        if not isinstance(item, dict):\n            raise ValueError("gate assertion item must be an object")\n        contract_id = item.get("contract_id")\n        if contract_id in assertions_by_id:\n            raise ValueError(f"duplicate gate assertion: {contract_id}")\n        if contract_id not in REQUIRED_MOBILE_GATE_IDS:\n            raise ValueError(f"unknown gate assertion: {contract_id}")\n        status = item.get("status")\n        if status not in {"passed", "not_applicable", "blocked"}:\n            raise ValueError(f"invalid gate assertion status: {contract_id}")\n        if status == "blocked":\n            raise ValueError(f"blocked mandatory gate prevents reader rendering: {contract_id}")\n        if status == "not_applicable" and not isinstance(\n            item.get("applicability_rationale"), str\n        ):\n            raise ValueError(\n                f"not_applicable gate requires applicability rationale: {contract_id}"\n            )\n        authority_path = item.get("authority_path")\n        authority_blob_sha = item.get("authority_blob_sha")\n        if authority_by_path.get(authority_path) != authority_blob_sha:\n            raise ValueError(f"gate assertion authority binding is invalid: {contract_id}")\n        evidence_refs = item.get("evidence_refs")\n        if (\n            not isinstance(evidence_refs, list)\n            or not evidence_refs\n            or any(not isinstance(ref, str) or not ref.strip() for ref in evidence_refs)\n        ):\n            raise ValueError(f"gate assertion requires evidence refs: {contract_id}")\n        assertions_by_id[contract_id] = item\n\n    missing = set(REQUIRED_MOBILE_GATE_IDS).difference(assertions_by_id)\n    if missing:\n        raise ValueError(\n            "mandatory gate assertions are incomplete: " + ", ".join(sorted(missing))\n        )\n    if len(assertions_by_id) != len(REQUIRED_MOBILE_GATE_IDS):\n        raise ValueError("mandatory gate assertion count is inconsistent")\n\n    image_artifact = record.get("image_evidence_artifact")\n    if not isinstance(image_artifact, dict):\n        raise ValueError("image gate assertions require bound image evidence")\n    image_identity = f"{image_artifact.get('path')}@{image_artifact.get('blob_sha')}"\n    for contract_id in IMAGE_GATE_ASSERTION_IDS:\n        refs = assertions_by_id[contract_id]["evidence_refs"]\n        if image_identity not in refs:\n            raise ValueError(\n                f"image gate assertion must bind current image evidence: {contract_id}"\n            )\n'''
          replace_once(p, '\n\ndef _validate_window(window: Any, label: str) -> None:', validator + '\n\ndef _validate_window(window: Any, label: str) -> None:')
          replace_once(
              p,
              '    if (\n        current.get("image_evidence_artifact") is not None\n        and (\n            current["stage_index"] >= STAGE_INDEX["reader-rendered"]\n            or "NATIVE_MEDIA_UNAVAILABLE" in current["capability_limitations"]\n        )\n    ):\n        _validate_bound_image_evidence(ledger_dir, current)\n    _atomic_write(current_path, current)',
              '    if (\n        current.get("image_evidence_artifact") is not None\n        and (\n            current["stage_index"] >= STAGE_INDEX["reader-rendered"]\n            or "NATIVE_MEDIA_UNAVAILABLE" in current["capability_limitations"]\n        )\n    ):\n        _validate_bound_image_evidence(ledger_dir, current)\n'
              '    if (\n        current.get("gate_assertions_artifact") is not None\n        and current["stage_index"] >= STAGE_INDEX["reader-rendered"]\n    ):\n        _validate_bound_gate_assertions(ledger_dir, current)\n'
              '    _atomic_write(current_path, current)'
          )
          replace_once(
              p,
              '    advance.add_argument("--image-evidence-artifact", type=Path)\n    advance.add_argument("--durable-audit-status",',
              '    advance.add_argument("--image-evidence-artifact", type=Path)\n'
              '    advance.add_argument("--gate-assertions-artifact", type=Path)\n'
              '    advance.add_argument("--durable-audit-status",'
          )
          replace_once(
              p,
              '            image_evidence_artifact=(\n                _read_artifact_reference(args.image_evidence_artifact)\n                if args.image_evidence_artifact else None\n            ),\n            durable_audit_status=args.durable_audit_status,',
              '            image_evidence_artifact=(\n                _read_artifact_reference(args.image_evidence_artifact)\n                if args.image_evidence_artifact else None\n            ),\n'
              '            gate_assertions_artifact=(\n'
              '                _read_artifact_reference(args.gate_assertions_artifact)\n'
              '                if args.gate_assertions_artifact else None\n'
              '            ),\n'
              '            durable_audit_status=args.durable_audit_status,'
          )
          replace_once(
              p,
              '        if (\n            result.get("image_evidence_artifact") is not None\n            and (\n                result["stage_index"] >= STAGE_INDEX["reader-rendered"]\n                or "NATIVE_MEDIA_UNAVAILABLE" in result["capability_limitations"]\n            )\n        ):\n            _validate_bound_image_evidence(args.input.parent, result)\n    print(json.dumps(result, ensure_ascii=False, indent=2, sort_keys=True))',
              '        if (\n            result.get("image_evidence_artifact") is not None\n            and (\n                result["stage_index"] >= STAGE_INDEX["reader-rendered"]\n                or "NATIVE_MEDIA_UNAVAILABLE" in result["capability_limitations"]\n            )\n        ):\n            _validate_bound_image_evidence(args.input.parent, result)\n'
              '        if (\n            result.get("gate_assertions_artifact") is not None\n            and result["stage_index"] >= STAGE_INDEX["reader-rendered"]\n        ):\n            _validate_bound_gate_assertions(args.input.parent, result)\n'
              '    print(json.dumps(result, ensure_ascii=False, indent=2, sort_keys=True))'
          )

          # 4) Mobile execution authority: explicit coverage proof, no old B-or-higher gate name.
          p = 'mobile-chatgpt-daily-prompt.md'
          text = read(p)
          old_marker = '`MOBILE_PER_STORY_VISIBLE_IMAGE_GATE`（取代整份層級的 `MOBILE_B_OR_HIGHER_VISIBLE_IMAGE_GATE`）'
          if old_marker not in text:
              raise SystemExit('obsolete mobile image gate marker baseline not found')
          text = text.replace(old_marker, '`MOBILE_PER_STORY_VISIBLE_IMAGE_GATE`', 1)
          anchor = '## Same-source recovery order\n'
          if text.count(anchor) != 1:
              raise SystemExit('mobile prompt same-source anchor mismatch')
          registry_lines = '\n'.join(f'- `{item}`' for item in GATE_IDS)
          section = f'''## Mandatory mobile release gate coverage\n\n`MANDATORY_GATE_EXECUTION_ASSERTION`\n\n在 mobile-native 進入 `reader-rendered` 前，必須先建立並持久化 `logs/runs/<run_id>/gate-assertions.json`，再把其 Git blob 綁定到 `logs/current.json.gate_assertions_artifact`。這份 artifact 不是第二份新聞規則，只是「本輪已逐項讀取、判定並以 artifact 證明」的 coverage receipt；每條行為本身仍以 `INSTALL.md` 的權責順序及該 gate 所在權責文件為準。\n\n`MOBILE_MANDATORY_GATE_REGISTRY`：本輪 mobile-native release coverage 固定包含下列 contract IDs；schema 與 `scripts/manage_mobile_run_log.py` 必須與此清單完全一致，缺一、重複、未知 ID 或 `blocked` 都禁止進入 `reader-rendered`：\n\n{registry_lines}\n\n每筆 assertion 必須保存 `contract_id`、`status`、`authority_path`、`authority_blob_sha`、`evidence_refs` 與 `checked_at`。只有規則本身具有條件適用性且本輪確實不適用時才可用 `not_applicable`，並必填 `applicability_rationale` 與可核實 evidence；不得以「沒有工具」、「看起來不需要」或「已閱讀」作為證據。`authority_snapshot` 至少綁定本輪固定 SHA 下的 `INSTALL.md`、`mobile-chatgpt-daily-prompt.md`、`.agents/skills/daily-news-brief/SKILL.md` 與 `schemas/mobile-run-log.schema.json` Git blob SHA。\n\n圖片相關 assertions 必須直接引用同一 run 綁定的 `image-evidence.json@<blob_sha>`；因此「來源確實沒有合格圖片才可省略」不能被重新解讀成「圖片為 optional」。任何 selected event 缺逐則 image evidence、四層搜尋尚未按規則窮盡、找到合格圖片卻未完成可見交付，或 evidence 與 selected IDs 不守恆時，gate receipt 不得通過。generic 自我宣告、摘要規則或只寫 `passed=true` 不算 evidence。\n\n'''
          text = text.replace(anchor, section + anchor, 1)
          stale = '正常只維護 `logs/current.json`、`logs/previous.json`、`logs/latest-candidate-audit.json` 與 `logs/latest-reader.md`，不得寫入 `main`，也不得逐新聞或逐工具呼叫建立紀錄。'
          replacement = '正常只維護 `logs/current.json`、`logs/previous.json`、`logs/latest-candidate-audit.json`、`logs/latest-reader.md`，以及本輪 `logs/runs/<run_id>/` 下由 stage 契約明確要求的 candidate audit、verification、map decisions、image evidence 與 gate assertions；不得寫入 `main`，也不得逐新聞或逐工具呼叫另造紀錄。'
          if stale not in text:
              raise SystemExit('mobile prompt durable-write baseline not found')
          text = text.replace(stale, replacement, 1)
          write(p, text)

          # 5) INSTALL remains the unique authority and now names the machine-enforced receipt.
          p = 'INSTALL.md'
          text = read(p)
          old = '- `schemas/mobile-run-log.schema.json`\n\n### 核心工具與地圖資產'
          new = '- `schemas/mobile-run-log.schema.json`\n- `schemas/mobile-gate-assertions.schema.json`\n\n### 核心工具與地圖資產'
          if old not in text:
              raise SystemExit('INSTALL schema list anchor mismatch')
          text = text.replace(old, new, 1)
          old = '- `schemas/mobile-run-log.schema.json`\n- `mobile-chatgpt-start-prompt.md`'
          new = '- `schemas/mobile-run-log.schema.json`\n- `schemas/mobile-gate-assertions.schema.json`\n- `mobile-chatgpt-start-prompt.md`'
          if old not in text:
              raise SystemExit('INSTALL mobile support anchor mismatch')
          text = text.replace(old, new, 1)
          media_anchor = '## 七、局部恢復指令\n'
          if text.count(media_anchor) != 1:
              raise SystemExit('INSTALL recovery anchor mismatch')
