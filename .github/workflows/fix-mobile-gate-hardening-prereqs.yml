name: Align hardening prerequisites

on:
  push:
    branches:
      - hardening/mobile-gate-assertions-20260829
    paths:
      - '.github/workflows/fix-mobile-gate-hardening-prereqs.yml'

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/mobile-gate-assertions-20260829
      - name: Retire legacy test assumptions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected 1 match, got {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          # Recovery contract names the gate explicitly while preserving the migration anchor.
          p = Path('.agents/skills/recover-news-run/SKILL.md')
          text = p.read_text(encoding='utf-8')
          anchor = '## 3. mobile-native：同一 ledger 內恢復\n\n'
          if text.count(anchor) != 1:
              raise SystemExit('recover mobile section anchor mismatch')
          text = text.replace(
              anchor,
              anchor + '`MANDATORY_GATE_EXECUTION_ASSERTION` 是 mobile-native render 前的 mandatory coverage boundary；若 receipt 本身缺失或證據不足，只恢復缺失的 gate evidence，不得另造新聞流程。\n\n',
              1,
          )
          p.write_text(text, encoding='utf-8', newline='\n')

          # The old start-prompt test itself encoded a retired second authority (model/time/test-run details).
          path = 'tests/test_pipeline_contract.py'
          old = '''    def test_mobile_chatgpt_profile_is_low_cost_and_preserves_minimum_contract(self):\n        start = (ROOT / "mobile-chatgpt-start-prompt.md").read_text(encoding="utf-8")\n        daily = (ROOT / "mobile-chatgpt-daily-prompt.md").read_text(encoding="utf-8")\n\n        self.assertIn("Instant", start)\n        self.assertIn("不要使用 Thinking 或 Pro", start)\n        self.assertIn("每天 06:00", start)\n        self.assertIn("建立後立即執行一次", start)\n        for requirement in ("十四天", "六項", "C 級以上", "圖片說明"):\n            self.assertIn(requirement, daily)\n        for forbidden in ("Codex", "powershell", "bootstrap capsule", "git clone"):\n            self.assertNotIn(forbidden, daily)\n'''
          new = '''    def test_mobile_chatgpt_profile_uses_install_as_single_entrypoint(self):\n        start = (ROOT / "mobile-chatgpt-start-prompt.md").read_text(encoding="utf-8")\n        daily = (ROOT / "mobile-chatgpt-daily-prompt.md").read_text(encoding="utf-8")\n\n        self.assertIn("唯一安裝入口", start)\n        self.assertIn("INSTALL.md", start)\n        self.assertIn("不得另開新對話", start)\n        for retired in ("GitHub 規則來源：", "最低驗收不可省略", "不要使用 Thinking 或 Pro"):\n            self.assertNotIn(retired, start)\n        for requirement in ("十四天", "六項", "C 級以上", "圖片說明"):\n            self.assertIn(requirement, daily)\n        for forbidden in ("Codex", "powershell", "bootstrap capsule", "git clone"):\n            self.assertNotIn(forbidden, daily)\n'''
          replace_once(path, old, new)

          old = '''        self.assertIn("full-runtime 保存本地頁面證據", policy)\n        self.assertIn("mobile-native 保存宿主結構化檢查結果", policy)\n        self.assertIn("mobile-native 依序嘗試文章直接媒體 URL、原生圖片搜尋／圖片卡與後續來源", readme)\n        self.assertIn("只有 full-runtime 取得並驗證 capsule", readme)\n'''
          new = '''        self.assertIn("full-runtime 保存本地頁面證據", policy)\n        self.assertIn("mobile-native 保存宿主結構化檢查結果", policy)\n        self.assertIn("逐則圖片 evidence", readme)\n        self.assertIn("MANDATORY_GATE_EXECUTION_ASSERTION", readme)\n        self.assertIn("只有 full-runtime 取得並驗證 capsule", readme)\n'''
          replace_once(path, old, new)

          # One existing resume test hand-built the reader boundary instead of using mobile_artifacts().
          path = 'tests/test_manage_mobile_run_log.py'
          old = '''        artifacts["reader-rendered"] = {\n            "map_decisions_artifact": maps,\n            "image_evidence_artifact": self.mobile_artifacts()["reader-rendered"][\n                "image_evidence_artifact"\n            ],\n        }\n'''
          new = '''        artifacts["reader-rendered"] = {\n            "map_decisions_artifact": maps,\n            "image_evidence_artifact": self.mobile_artifacts()["reader-rendered"][\n                "image_evidence_artifact"\n            ],\n            "gate_assertions_artifact": self.mobile_artifacts()["reader-rendered"][\n                "gate_assertions_artifact"\n            ],\n        }\n'''
          replace_once(path, old, new)

          Path('.github/workflows/fix-mobile-gate-hardening-prereqs.yml').unlink()
          PY
      - name: Commit prerequisite alignment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Retire legacy mobile setup test assumptions"
          git push origin HEAD:hardening/mobile-gate-assertions-20260829
