name: Run mobile gate hardening v2

on:
  push:
    branches:
      - hardening/mobile-gate-assertions-20260829
    paths:
      - '.github/workflows/run-mobile-gate-hardening-v2.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: hardening/mobile-gate-assertions-20260829

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install formal runtime test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          python3 -m pip install --disable-pip-version-check pillow

      - name: Apply source migration
        run: |
          python3 tools/apply_mobile_gate_hardening_v2.py
          python3 tools/fix_reader_stage_gate_test.py

      - name: Compile changed runtime programs
        run: |
          python3 -m py_compile \
            scripts/mobile_gate_assertions.py \
            scripts/manage_mobile_run_log.py \
            scripts/news_run_checkpoint.py

      - name: Run focused hardening regressions
        run: |
          python3 -m unittest \
            tests/test_mobile_gate_assertions_contract.py \
            tests/test_manage_mobile_run_log.py \
            tests/test_no_obsolete_contracts.py \
            tests/test_pipeline_contract.py \
            -v

      - name: Commit validated source candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git add -A
          git diff --cached --check
          git commit -m "Enforce mobile mandatory release contract assertions"
          git push origin HEAD:hardening/mobile-gate-assertions-20260829

      - name: Build deterministic capsule from source candidate
        run: |
          SOURCE_SHA=$(git rev-parse HEAD)
          python3 scripts/build_bootstrap_capsule.py --source-commit "$SOURCE_SHA"

      - name: Verify capsule against source candidate
        run: python3 scripts/verify_bootstrap_capsule.py

      - name: Run complete repository test suite
        run: python3 -m unittest discover -s tests -v

      - name: Commit verified capsule candidate
        run: |
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git add bootstrap/capsule-manifest.json bootstrap/capsule-payload.tar.xz bootstrap/capsule.part*.txt
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "Build verified hardening capsule candidate"
            git push origin HEAD:hardening/mobile-gate-assertions-20260829
          fi
