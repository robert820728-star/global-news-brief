name: Run mobile gate hardening v2

on:
  push:
    branches:
      - hardening/mobile-gate-assertions-20260829
    paths:
      - '.github/workflows/run-mobile-gate-hardening-v2.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: hardening/mobile-gate-assertions-20260829

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install formal runtime test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          python3 -m pip install --disable-pip-version-check pillow

      - name: Apply source migration
        shell: bash
        run: |
          python3 - <<'PY'
          from __future__ import annotations
          import json
          import re
          from pathlib import Path

          ROOT = Path('.')
          GATE_IDS = [
              'RUN_INPUT_NORMALIZATION_GATE',
              'DISCOVERY_THEN_VERIFY',
              'REGIONAL_SUPPLEMENT_COMPLETE_MODEL_ADMISSION_GATE',
              'MOBILE_STRUCTURAL_ADMISSION_EQUIVALENT',
              'GLOBAL_SECTION_PRIMARY_DISCOVERY_GATE',
              'PIPELINE_COUNT_RECEIPT',
              'COUNT_RECEIPT_REPAIR_ONCE',
              'SEMANTIC_EVENT_LEDGER_GATE',
              'EVENT_REGION_AND_TIME_IDENTITY_GATE',
              'POLICY_GOVERNANCE_EVIDENCE_GATE',
              'PUBLIC_VALUE_V2_NORMALIZED_WEIGHTED_SCORING',
              'CATEGORY_APPROPRIATE_EVIDENCE_ROUTE',
              'SAME_SOURCE_RECOVERY_ORDER',
              'MOBILE_NATIVE_IMAGE_EVIDENCE_ROUTE',
              'MOBILE_PER_STORY_VISIBLE_IMAGE_GATE',
              'DIRECT_ARTICLE_MEDIA_DELIVERY_ROUTE',
              'IMAGE_FALLBACK_EXHAUSTION_GATE',
              'IMAGE_READER_VISIBLE_DELIVERY_GATE',
              'NATIVE_MEDIA_CAPABILITY_FALLBACK',
              'MOBILE_READER_STRUCTURE_EQUIVALENT',
              'CANONICAL_THREE_PART_READER_LAYOUT_GATE',
          ]
          IMAGE_GATE_IDS = [
              'MOBILE_NATIVE_IMAGE_EVIDENCE_ROUTE',
              'MOBILE_PER_STORY_VISIBLE_IMAGE_GATE',
              'DIRECT_ARTICLE_MEDIA_DELIVERY_ROUTE',
              'IMAGE_FALLBACK_EXHAUSTION_GATE',
              'IMAGE_READER_VISIBLE_DELIVERY_GATE',
              'NATIVE_MEDIA_CAPABILITY_FALLBACK',
          ]
          READER_GATE_IDS = [
              'MOBILE_READER_STRUCTURE_EQUIVALENT',
              'CANONICAL_THREE_PART_READER_LAYOUT_GATE',
          ]

          def read(path: str) -> str:
              return (ROOT / path).read_text(encoding='utf-8')

          def write(path: str, text: str) -> None:
              target = ROOT / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(text, encoding='utf-8', newline='\n')

          def replace_once(path: str, old: str, new: str) -> None:
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one replacement, found {count}: {old[:100]!r}')
              write(path, text.replace(old, new, 1))

          # ------------------------------------------------------------------
          # Machine-readable assertion contract + runtime validator helper.
          # ------------------------------------------------------------------
          gate_schema = {
              '$schema': 'https://json-schema.org/draft/2020-12/schema',
              '$id': 'https://github.com/robert820728-star/global-news-brief/schemas/mobile-gate-assertions.schema.json',
              'title': 'Mobile mandatory release gate assertions',
              'type': 'object',
              'additionalProperties': False,
              'required': [
                  'schema_version', 'execution_mode', 'run_id', 'main_sha', 'window',
                  'authority_snapshot', 'assertions'
              ],
              'properties': {
                  'schema_version': {'const': '1.0.0'},
                  'execution_mode': {'const': 'mobile-native'},
                  'run_id': {'type': 'string', 'pattern': '^gnb-[0-9]{8}T[0-9]{6}Z-[0-9a-f]{8}$'},
                  'main_sha': {'type': 'string', 'pattern': '^[0-9a-f]{40}$'},
                  'window': {
                      'type': 'object',
                      'additionalProperties': False,
                      'required': ['start', 'end', 'timezone'],
                      'properties': {
                          'start': {'type': 'string', 'format': 'date-time'},
                          'end': {'type': 'string', 'format': 'date-time'},
                          'timezone': {'type': 'string', 'minLength': 1},
                      },
                  },
                  'authority_snapshot': {
                      'type': 'array', 'minItems': 4, 'uniqueItems': True,
                      'items': {
                          'type': 'object', 'additionalProperties': False,
                          'required': ['path', 'blob_sha'],
                          'properties': {
                              'path': {'type': 'string', 'minLength': 1},
                              'blob_sha': {'type': 'string', 'pattern': '^[0-9a-f]{40}$'},
                          },
                      },
                  },
                  'assertions': {
                      'type': 'array',
                      'minItems': len(GATE_IDS),
                      'maxItems': len(GATE_IDS),
                      'items': {
                          'type': 'object', 'additionalProperties': False,
                          'required': [
                              'contract_id', 'status', 'authority_path', 'authority_blob_sha',
                              'evidence_refs', 'checked_at'
                          ],
                          'properties': {
                              'contract_id': {'enum': GATE_IDS},
                              'status': {'enum': ['passed', 'not_applicable', 'blocked']},
                              'authority_path': {'type': 'string', 'minLength': 1},
                              'authority_blob_sha': {'type': 'string', 'pattern': '^[0-9a-f]{40}$'},
                              'evidence_refs': {
                                  'type': 'array', 'minItems': 1, 'uniqueItems': True,
                                  'items': {'type': 'string', 'minLength': 1},
                              },
                              'checked_at': {'type': 'string', 'format': 'date-time'},
                              'applicability_rationale': {'type': 'string', 'minLength': 1},
                          },
                      },
                  },
              },
          }
          write('schemas/mobile-gate-assertions.schema.json', json.dumps(gate_schema, ensure_ascii=False, indent=2) + '\n')

          helper = '''#!/usr/bin/env python3
"""Validate the mobile-native mandatory release gate coverage receipt.

This module validates coverage/bindings only. Behaviour remains authoritative in
INSTALL.md and the repository documents/skills it routes to.
"""
from __future__ import annotations

from typing import Any

SCHEMA_VERSION = "1.0.0"
REQUIRED_MOBILE_GATE_IDS = (
''' + ''.join(f'    "{item}",\n' for item in GATE_IDS) + ''')
IMAGE_GATE_ASSERTION_IDS = frozenset((
''' + ''.join(f'    "{item}",\n' for item in IMAGE_GATE_IDS) + '''))
READER_GATE_ASSERTION_IDS = frozenset((
''' + ''.join(f'    "{item}",\n' for item in READER_GATE_IDS) + '''))
REQUIRED_AUTHORITY_PATHS = frozenset((
    "INSTALL.md",
    "mobile-chatgpt-daily-prompt.md",
    ".agents/skills/daily-news-brief/SKILL.md",
    "schemas/mobile-run-log.schema.json",
))


def _is_hex_sha(value: Any) -> bool:
    return (
        isinstance(value, str)
        and len(value) == 40
        and all(character in "0123456789abcdef" for character in value)
    )


def validate_gate_assertions(
    value: Any,
    *,
    record: dict[str, Any],
    allowed_evidence_refs: set[str],
    image_identity: str,
    reader_identity: str,
) -> None:
    if not isinstance(value, dict) or value.get("schema_version") != SCHEMA_VERSION:
        raise ValueError("bound gate assertions use an unsupported schema")
    if value.get("execution_mode") != "mobile-native":
        raise ValueError("bound gate assertions require mobile-native execution_mode")
    if value.get("run_id") != record.get("run_id") or value.get("main_sha") != record.get("main_sha"):
        raise ValueError("bound gate assertions identity does not match the current run")
    if value.get("window") != record.get("window"):
        raise ValueError("bound gate assertions window does not match the ledger")

    snapshot = value.get("authority_snapshot")
    if not isinstance(snapshot, list):
        raise ValueError("gate assertions require authority_snapshot")
    authority_by_path: dict[str, str] = {}
    for item in snapshot:
        if not isinstance(item, dict) or set(item) != {"path", "blob_sha"}:
            raise ValueError("gate authority snapshot item is invalid")
        path = item.get("path")
        blob_sha = item.get("blob_sha")
        if not isinstance(path, str) or not path or path in authority_by_path or not _is_hex_sha(blob_sha):
            raise ValueError("gate authority snapshot identity is invalid")
        authority_by_path[path] = blob_sha
    missing_authorities = REQUIRED_AUTHORITY_PATHS.difference(authority_by_path)
    if missing_authorities:
        raise ValueError(
            "gate assertions are missing authority snapshots: "
            + ", ".join(sorted(missing_authorities))
        )

    assertions = value.get("assertions")
    if not isinstance(assertions, list):
        raise ValueError("gate assertions require assertions array")
    by_id: dict[str, dict[str, Any]] = {}
    for item in assertions:
        if not isinstance(item, dict):
            raise ValueError("gate assertion item must be an object")
        contract_id = item.get("contract_id")
        if contract_id in by_id:
            raise ValueError(f"duplicate gate assertion: {contract_id}")
        if contract_id not in REQUIRED_MOBILE_GATE_IDS:
            raise ValueError(f"unknown gate assertion: {contract_id}")
        status = item.get("status")
        if status not in {"passed", "not_applicable", "blocked"}:
            raise ValueError(f"invalid gate assertion status: {contract_id}")
        if status == "blocked":
            raise ValueError(f"blocked mandatory gate prevents publication: {contract_id}")
        if status == "not_applicable":
            rationale = item.get("applicability_rationale")
            if not isinstance(rationale, str) or not rationale.strip():
                raise ValueError(f"not_applicable gate requires rationale: {contract_id}")
        authority_path = item.get("authority_path")
        if authority_by_path.get(authority_path) != item.get("authority_blob_sha"):
            raise ValueError(f"gate assertion authority binding is invalid: {contract_id}")
        refs = item.get("evidence_refs")
        if (
            not isinstance(refs, list)
            or not refs
            or len(refs) != len(set(refs))
            or any(not isinstance(ref, str) or ref not in allowed_evidence_refs for ref in refs)
        ):
            raise ValueError(f"gate assertion requires current bound artifact evidence: {contract_id}")
        by_id[contract_id] = item

    missing = set(REQUIRED_MOBILE_GATE_IDS).difference(by_id)
    if missing:
        raise ValueError("mandatory gate assertions are incomplete: " + ", ".join(sorted(missing)))
    if len(by_id) != len(REQUIRED_MOBILE_GATE_IDS):
        raise ValueError("mandatory gate assertion count is inconsistent")

    for contract_id in IMAGE_GATE_ASSERTION_IDS:
        if image_identity not in by_id[contract_id]["evidence_refs"]:
            raise ValueError(f"image gate assertion must bind current image evidence: {contract_id}")
    for contract_id in READER_GATE_ASSERTION_IDS:
        if reader_identity not in by_id[contract_id]["evidence_refs"]:
            raise ValueError(f"reader gate assertion must bind current reader: {contract_id}")
'''
          write('scripts/mobile_gate_assertions.py', helper)

          # ------------------------------------------------------------------
          # Mobile ledger/schema integration. Gate receipt is a publish boundary
          # (github-result-saved), after Reader structure can actually be checked.
          # ------------------------------------------------------------------
          schema_path = ROOT / 'schemas/mobile-run-log.schema.json'
          schema = json.loads(schema_path.read_text(encoding='utf-8'))
          if schema['properties']['schema_version'].get('const') != '1.6.0':
              raise SystemExit('unexpected mobile-run-log schema baseline')
          schema['properties']['schema_version']['const'] = '1.7.0'
          if 'gate_assertions_artifact' in schema['required']:
              raise SystemExit('gate_assertions_artifact unexpectedly already exists')
          schema['required'].insert(schema['required'].index('image_evidence_artifact') + 1, 'gate_assertions_artifact')
          schema['properties']['gate_assertions_artifact'] = {
              'oneOf': [
                  {'type': 'null'},
                  {
                      'type': 'object', 'additionalProperties': False,
                      'required': ['branch', 'path', 'blob_sha', 'run_id', 'main_sha', 'window'],
                      'properties': {
                          'branch': {'const': 'run-logs'},
                          'path': {'type': 'string', 'pattern': '^logs/runs/gnb-[0-9]{8}T[0-9]{6}Z-[0-9a-f]{8}/gate-assertions\\.json$'},
                          'blob_sha': {'type': 'string', 'pattern': '^[0-9a-f]{40}$'},
                          'run_id': {'type': 'string', 'pattern': '^gnb-[0-9]{8}T[0-9]{6}Z-[0-9a-f]{8}$'},
                          'main_sha': {'type': 'string', 'pattern': '^[0-9a-f]{40}$'},
                          'window': {'$ref': '#/properties/window/oneOf/1'},
                      },
                  },
              ]
          }
          schema_path.write_text(json.dumps(schema, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          p = 'scripts/manage_mobile_run_log.py'
          replace_once(p, 'import run_identity\n', 'import run_identity\nimport mobile_gate_assertions\n')
          replace_once(p, 'SCHEMA_VERSION = "1.6.0"', 'SCHEMA_VERSION = "1.7.0"')
          replace_once(p, '        "image_evidence_artifact",\n        "durable_audit_status",', '        "image_evidence_artifact",\n        "gate_assertions_artifact",\n        "durable_audit_status",')
          replace_once(
              p,
              '        ("image_evidence_artifact", "visuals-completed", "image evidence artifact"),\n        ("reader_artifact", "reader-rendered", "reader artifact"),',
              '        ("image_evidence_artifact", "visuals-completed", "image evidence artifact"),\n        ("reader_artifact", "reader-rendered", "reader artifact"),\n        ("gate_assertions_artifact", "github-result-saved", "gate assertions artifact"),'
          )
          replace_once(
              p,
              '        if record["stage_index"] >= STAGE_INDEX["github-result-saved"]:\n            _require_artifact(\n                record,\n                "reader_artifact",\n                "logs/latest-reader.md",\n                "reader artifact",\n            )',
              '        if record["stage_index"] >= STAGE_INDEX["github-result-saved"]:\n            _require_artifact(\n                record,\n                "reader_artifact",\n                "logs/latest-reader.md",\n                "reader artifact",\n            )\n            _require_run_artifact(\n                record,\n                "gate_assertions_artifact",\n                "gate-assertions.json",\n                "gate assertions artifact",\n            )'
          )
          gate_validator = '''\n\ndef _artifact_identity(artifact: dict[str, Any]) -> str:\n    return f"{artifact['path']}@{artifact['blob_sha']}"\n\n\ndef _validate_bound_gate_assertions(\n    ledger_dir: Path | str, record: dict[str, Any]\n) -> None:\n    if record.get("execution_mode") != "mobile-native":\n        return\n    artifact = record.get("gate_assertions_artifact")\n    if not isinstance(artifact, dict):\n        return\n    path = _bound_artifact_path(Path(ledger_dir), artifact, "gate assertions")\n    if not path.is_file():\n        raise ValueError("bound gate assertions file is missing")\n    try:\n        value = json.loads(path.read_text(encoding="utf-8"))\n    except (OSError, json.JSONDecodeError) as error:\n        raise ValueError("bound gate assertions are not readable JSON") from error\n\n    evidence_fields = (\n        "candidate_audit_artifact",\n        "verification_artifact",\n        "map_decisions_artifact",\n        "image_evidence_artifact",\n        "reader_artifact",\n    )\n    evidence_artifacts = [record.get(field) for field in evidence_fields]\n    if any(not isinstance(item, dict) for item in evidence_artifacts):\n        raise ValueError("gate assertions require all publication evidence artifacts")\n    allowed = {_artifact_identity(item) for item in evidence_artifacts}\n    image_identity = _artifact_identity(record["image_evidence_artifact"])\n    reader_identity = _artifact_identity(record["reader_artifact"])\n    mobile_gate_assertions.validate_gate_assertions(\n        value,\n        record=record,\n        allowed_evidence_refs=allowed,\n        image_identity=image_identity,\n        reader_identity=reader_identity,\n    )\n'''
          replace_once(p, '\n\ndef _validate_window(window: Any, label: str) -> None:', gate_validator + '\n\ndef _validate_window(window: Any, label: str) -> None:')
          replace_once(p, '        "image_evidence_artifact": None,\n        "durable_audit_status": "not_started",', '        "image_evidence_artifact": None,\n        "gate_assertions_artifact": None,\n        "durable_audit_status": "not_started",')
          replace_once(p, '    image_evidence_artifact: dict[str, str] | None = None,\n    durable_audit_status: str | None = None,', '    image_evidence_artifact: dict[str, str] | None = None,\n    gate_assertions_artifact: dict[str, str] | None = None,\n    durable_audit_status: str | None = None,')
          replace_once(p, '    if image_evidence_artifact is not None:\n        current["image_evidence_artifact"] = image_evidence_artifact\n    if durable_audit_status is not None:', '    if image_evidence_artifact is not None:\n        current["image_evidence_artifact"] = image_evidence_artifact\n    if gate_assertions_artifact is not None:\n        current["gate_assertions_artifact"] = gate_assertions_artifact\n    if durable_audit_status is not None:')
          replace_once(
              p,
              '    if (\n        current.get("image_evidence_artifact") is not None\n        and (\n            current["stage_index"] >= STAGE_INDEX["reader-rendered"]\n            or "NATIVE_MEDIA_UNAVAILABLE" in current["capability_limitations"]\n        )\n    ):\n        _validate_bound_image_evidence(ledger_dir, current)\n    _atomic_write(current_path, current)',
              '    if (\n        current.get("image_evidence_artifact") is not None\n        and (\n            current["stage_index"] >= STAGE_INDEX["reader-rendered"]\n            or "NATIVE_MEDIA_UNAVAILABLE" in current["capability_limitations"]\n        )\n    ):\n        _validate_bound_image_evidence(ledger_dir, current)\n    if (\n        current.get("gate_assertions_artifact") is not None\n        and current["stage_index"] >= STAGE_INDEX["github-result-saved"]\n    ):\n        _validate_bound_gate_assertions(ledger_dir, current)\n    _atomic_write(current_path, current)'
          )
          replace_once(p, '    advance.add_argument("--image-evidence-artifact", type=Path)\n    advance.add_argument("--durable-audit-status",', '    advance.add_argument("--image-evidence-artifact", type=Path)\n    advance.add_argument("--gate-assertions-artifact", type=Path)\n    advance.add_argument("--durable-audit-status",')
          replace_once(
              p,
              '            image_evidence_artifact=(\n                _read_artifact_reference(args.image_evidence_artifact)\n                if args.image_evidence_artifact else None\n            ),\n            durable_audit_status=args.durable_audit_status,',
              '            image_evidence_artifact=(\n                _read_artifact_reference(args.image_evidence_artifact)\n                if args.image_evidence_artifact else None\n            ),\n            gate_assertions_artifact=(\n                _read_artifact_reference(args.gate_assertions_artifact)\n                if args.gate_assertions_artifact else None\n            ),\n            durable_audit_status=args.durable_audit_status,'
          )
          replace_once(
              p,
              '        if (\n            result.get("image_evidence_artifact") is not None\n            and (\n                result["stage_index"] >= STAGE_INDEX["reader-rendered"]\n                or "NATIVE_MEDIA_UNAVAILABLE" in result["capability_limitations"]\n            )\n        ):\n            _validate_bound_image_evidence(args.input.parent, result)\n    print(json.dumps(result, ensure_ascii=False, indent=2, sort_keys=True))',
              '        if (\n            result.get("image_evidence_artifact") is not None\n            and (\n                result["stage_index"] >= STAGE_INDEX["reader-rendered"]\n                or "NATIVE_MEDIA_UNAVAILABLE" in result["capability_limitations"]\n            )\n        ):\n            _validate_bound_image_evidence(args.input.parent, result)\n        if (\n            result.get("gate_assertions_artifact") is not None\n            and result["stage_index"] >= STAGE_INDEX["github-result-saved"]\n        ):\n            _validate_bound_gate_assertions(args.input.parent, result)\n    print(json.dumps(result, ensure_ascii=False, indent=2, sort_keys=True))'
          )

          # Full-runtime bootstrap closure must contain the new runtime contract/helper.
          replace_once(
              'scripts/news_run_checkpoint.py',
              '    "schemas/mobile-run-log.schema.json",\n    ".agents/skills/daily-news-brief/SKILL.md",',
              '    "schemas/mobile-run-log.schema.json",\n    "schemas/mobile-gate-assertions.schema.json",\n    ".agents/skills/daily-news-brief/SKILL.md",'
          )
          replace_once(
              'scripts/news_run_checkpoint.py',
              '    "scripts/news_run_checkpoint.py",\n    "scripts/fetch_source_routes.py",',
              '    "scripts/news_run_checkpoint.py",\n    "scripts/mobile_gate_assertions.py",\n    "scripts/fetch_source_routes.py",'
          )

          # ------------------------------------------------------------------
          # Authority documents: keep INSTALL as the sole launcher authority.
          # ------------------------------------------------------------------
          p = 'mobile-chatgpt-daily-prompt.md'
          text = read(p)
          retired = '`MOBILE_PER_STORY_VISIBLE_IMAGE_GATE`（取代整份層級的 `MOBILE_B_OR_HIGHER_VISIBLE_IMAGE_GATE`）'
          if text.count(retired) != 1:
              raise SystemExit('retired mobile image gate marker baseline mismatch')
          text = text.replace(retired, '`MOBILE_PER_STORY_VISIBLE_IMAGE_GATE`', 1)
          anchor = '## Same-source recovery order\n'
          if text.count(anchor) != 1:
              raise SystemExit('same-source section anchor mismatch')
          registry = '\n'.join(f'- `{item}`' for item in GATE_IDS)
          coverage = f'''## Mandatory mobile release gate coverage\n\n`MANDATORY_GATE_EXECUTION_ASSERTION`\n\nmobile-native 在把本輪 Reader 保存為正式 GitHub 結果（`github-result-saved`）前，必須先建立並持久化 `logs/runs/<run_id>/gate-assertions.json`，再把其 Git blob 綁定到 `logs/current.json.gate_assertions_artifact`。這份 artifact 只證明本輪對 release-critical contracts 已逐項判定並有現行 artifact 證據，**不是第二份新聞規則**；實際行為仍只以 `INSTALL.md` 的權責順序與各 contract 所在權責文件為準。\n\n`MOBILE_MANDATORY_GATE_REGISTRY`：本輪 release coverage 固定包含下列 contract IDs；`schemas/mobile-gate-assertions.schema.json`、`scripts/mobile_gate_assertions.py` 與 `scripts/manage_mobile_run_log.py` 必須與此清單完全一致。缺項、重複、未知 ID、無現行 evidence 或任何 `blocked` 都不得保存正式 Reader，也不得進入完成狀態：\n\n{registry}\n\n每筆 assertion 必須保存 `contract_id`、`status`、`authority_path`、`authority_blob_sha`、`evidence_refs` 與 `checked_at`。只有規則本身具有條件適用性且本輪確實不適用時才可用 `not_applicable`，並必填 `applicability_rationale`；「沒有工具」、「看起來不需要」、「已閱讀」或單純 `passed=true` 都不算證據。`authority_snapshot` 至少綁定本輪固定 `main_sha` 下的 `INSTALL.md`、`mobile-chatgpt-daily-prompt.md`、`.agents/skills/daily-news-brief/SKILL.md` 與 `schemas/mobile-run-log.schema.json` Git blob SHA。\n\n`evidence_refs` 只能引用本輪已綁定的 candidate audit、verification、map decisions、image evidence 或 Reader Git blob identity。所有圖片 contracts 都必須直接引用同一 run 的 `image-evidence.json@<blob_sha>`；因此「來源確實沒有合格圖片才可省略」不得被重新解讀成「圖片為 optional」。Reader 結構 contracts 則必須直接引用本輪 `logs/latest-reader.md@<blob_sha>`。若 selected event 缺逐則 image evidence、四層搜尋尚未依規則窮盡、找到合格圖片卻未完成可見交付、Reader 結構未通過，或任何 evidence 與本輪 identity 不一致，release receipt 都不得通過。\n\n'''
