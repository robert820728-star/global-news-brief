          contract_test = '''import importlib.util\nimport json\nimport re\nimport sys\nimport unittest\nfrom pathlib import Path\n\nROOT = Path(__file__).resolve().parents[1]\nSCRIPTS = ROOT / "scripts"\nif str(SCRIPTS) not in sys.path:\n    sys.path.insert(0, str(SCRIPTS))\n\ndef load_helper():\n    path = SCRIPTS / "mobile_gate_assertions.py"\n    spec = importlib.util.spec_from_file_location("mobile_gate_assertions_contract", path)\n    module = importlib.util.module_from_spec(spec)\n    spec.loader.exec_module(module)\n    return module\n\nclass MobileGateAssertionsContractTests(unittest.TestCase):\n    def test_registry_matches_schema_runtime_and_mobile_prompt(self):\n        helper = load_helper()\n        schema = json.loads((ROOT / "schemas/mobile-gate-assertions.schema.json").read_text(encoding="utf-8"))\n        schema_ids = schema["properties"]["assertions"]["items"]["properties"]["contract_id"]["enum"]\n        prompt = (ROOT / "mobile-chatgpt-daily-prompt.md").read_text(encoding="utf-8")\n        block = prompt.split("`MOBILE_MANDATORY_GATE_REGISTRY`", 1)[1].split("每筆 assertion", 1)[0]\n        prompt_ids = re.findall(r"^- `([A-Z0-9_]+)`$", block, re.MULTILINE)\n        self.assertEqual(list(helper.REQUIRED_MOBILE_GATE_IDS), schema_ids)\n        self.assertEqual(list(helper.REQUIRED_MOBILE_GATE_IDS), prompt_ids)\n        self.assertEqual(len(prompt_ids), len(set(prompt_ids)))\n        for required_image_gate in (\n            "MOBILE_PER_STORY_VISIBLE_IMAGE_GATE",\n            "DIRECT_ARTICLE_MEDIA_DELIVERY_ROUTE",\n            "IMAGE_FALLBACK_EXHAUSTION_GATE",\n            "IMAGE_READER_VISIBLE_DELIVERY_GATE",\n        ):\n            self.assertIn(required_image_gate, helper.IMAGE_GATE_ASSERTION_IDS)\n\n    def test_active_authorities_name_mandatory_release_assertion(self):\n        for relative in (\n            "INSTALL.md", "mobile-chatgpt-daily-prompt.md", "news-brief-settings.md",\n            ".agents/skills/daily-news-brief/SKILL.md", ".agents/skills/recover-news-run/SKILL.md",\n        ):\n            self.assertIn("MANDATORY_GATE_EXECUTION_ASSERTION", (ROOT / relative).read_text(encoding="utf-8"), relative)\n        run_schema = json.loads((ROOT / "schemas/mobile-run-log.schema.json").read_text(encoding="utf-8"))\n        self.assertEqual("1.7.0", run_schema["properties"]["schema_version"]["const"] )\n        self.assertIn("gate_assertions_artifact", run_schema["required"])\n\n    def test_active_surfaces_have_no_retired_mobile_gate_or_alternate_result_conversation(self):\n        paths = [\n            ROOT / "INSTALL.md", ROOT / "README.md", ROOT / "mobile-chatgpt-start-prompt.md",\n            ROOT / "mobile-chatgpt-daily-prompt.md", ROOT / "daily-schedule-prompt.md", ROOT / "news-brief-settings.md",\n        ]\n        paths.extend((ROOT / ".agents/skills").rglob("*.md"))\n        forbidden = (\n            "MOBILE_B_OR_HIGHER_VISIBLE_IMAGE_GATE",\n            "以獨立結果對話輸出當日新聞",\n            "GitHub 規則來源：https://github.com/robert820728-star/global-news-brief/blob/main/mobile-chatgpt-daily-prompt.md",\n        )\n        hits = []\n        for path in paths:\n            body = path.read_text(encoding="utf-8")\n            for phrase in forbidden:\n                if phrase in body:\n                    hits.append(f"{path.relative_to(ROOT)}: {phrase}")\n        self.assertEqual([], hits)\n\n    def test_start_prompt_is_compatibility_redirect_only(self):\n        text = (ROOT / "mobile-chatgpt-start-prompt.md").read_text(encoding="utf-8")\n        self.assertIn("唯一安裝入口", text)\n        self.assertIn("INSTALL.md", text)\n        self.assertIn("不要把本檔", text)\n        self.assertNotIn("最低驗收不可省略", text)\n        self.assertNotIn("不要使用 Thinking 或 Pro", text)\n\nif __name__ == "__main__":\n    unittest.main()\n'''
          write('tests/test_mobile_gate_assertions_contract.py', contract_test)

          p = 'tests/test_no_obsolete_contracts.py'
          text = read(p)
          anchor = '    def test_active_execution_contracts_have_no_retired_relevance_or_recovery_prose(self):\n'
          if text.count(anchor) != 1:
              raise SystemExit('no-obsolete insertion anchor mismatch')
          method = '''    def test_active_execution_contracts_have_no_retired_mobile_image_gate(self):\n        paths = [\n            ROOT / "INSTALL.md", ROOT / "README.md", ROOT / "mobile-chatgpt-start-prompt.md",\n            ROOT / "mobile-chatgpt-daily-prompt.md", ROOT / "daily-schedule-prompt.md", ROOT / "news-brief-settings.md",\n        ]\n        paths.extend((ROOT / ".agents" / "skills").rglob("*.md"))\n        retired = "MOBILE_" + "B_OR_HIGHER_VISIBLE_IMAGE_GATE"\n        hits = [str(path.relative_to(ROOT)) for path in paths if retired in path.read_text(encoding="utf-8")]\n        self.assertEqual([], hits)\n\n'''
          text = text.replace(anchor, method + anchor, 1)
          write(p, text)

          # Active surface static stop-loss. Historical VERSION/docs may retain retired terms for traceability.
          active_roots = [
              'INSTALL.md', 'README.md', 'mobile-chatgpt-start-prompt.md',
              'mobile-chatgpt-daily-prompt.md', 'daily-schedule-prompt.md', 'news-brief-settings.md',
              '.agents/skills', 'schemas', 'scripts'
          ]
          hits = []
          for root_name in active_roots:
              root = ROOT / root_name
              candidates = [root] if root.is_file() else [item for item in root.rglob('*') if item.is_file()]
              for candidate in candidates:
                  if candidate.suffix.lower() not in {'.md', '.json', '.py', '.yaml', '.yml'}:
                      continue
                  body = candidate.read_text(encoding='utf-8')
                  for forbidden in (
                      'MOBILE_B_OR_HIGHER_VISIBLE_IMAGE_GATE',
                      '以獨立結果對話輸出當日新聞',
                      'GitHub 規則來源：https://github.com/robert820728-star/global-news-brief/blob/main/mobile-chatgpt-daily-prompt.md',
                  ):
                      if forbidden in body:
                          hits.append(f'{candidate}: {forbidden}')
          if hits:
              raise SystemExit('active contract residue:\n' + '\n'.join(hits))
          PY

      - name: Compile changed runtime programs
        run: |
          python3 -m py_compile \
            scripts/mobile_gate_assertions.py \
            scripts/manage_mobile_run_log.py \
            scripts/news_run_checkpoint.py

      - name: Run focused hardening regressions
        run: |
          python3 -m unittest \
            tests/test_mobile_gate_assertions_contract.py \
            tests/test_manage_mobile_run_log.py \
            tests/test_no_obsolete_contracts.py \
            tests/test_pipeline_contract.py \
            -v

      - name: Commit validated source candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add INSTALL.md README.md VERSION-RECORD.md mobile-chatgpt-start-prompt.md mobile-chatgpt-daily-prompt.md news-brief-settings.md
          git add .agents/skills/daily-news-brief/SKILL.md .agents/skills/recover-news-run/SKILL.md
          git add schemas/mobile-run-log.schema.json schemas/mobile-gate-assertions.schema.json
          git add scripts/manage_mobile_run_log.py scripts/mobile_gate_assertions.py scripts/news_run_checkpoint.py
          git add tests/test_manage_mobile_run_log.py tests/test_mobile_gate_assertions_contract.py tests/test_no_obsolete_contracts.py tests/test_pipeline_contract.py
          git diff --cached --check
          git commit -m "Enforce mobile mandatory release gate assertions"
          git push origin HEAD:hardening/mobile-gate-assertions-20260829

      - name: Build deterministic capsule from source candidate
        run: |
          SOURCE_SHA=$(git rev-parse HEAD)
          python3 scripts/build_bootstrap_capsule.py --source-commit "$SOURCE_SHA"

      - name: Verify capsule against source candidate
        run: python3 scripts/verify_bootstrap_capsule.py

      - name: Run complete repository test suite
        run: python3 -m unittest discover -s tests -v

      - name: Commit verified capsule candidate
        run: |
          git add bootstrap/capsule-manifest.json bootstrap/capsule-payload.tar.xz bootstrap/capsule.part*.txt
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "Build verified hardening capsule candidate"
            git push origin HEAD:hardening/mobile-gate-assertions-20260829
          fi
