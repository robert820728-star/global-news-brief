name: Branch hydration recovery CI

on:
  push:
    branches: [fix/hydration-recovery-contract-20260906]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check pillow
      - name: Compile changed runtime
        run: |
          python -m py_compile \
            scripts/hydrate_source_rows.py \
            scripts/remote_acquisition_bridge.py \
            scripts/remote_acquisition_bridge_v2.py \
            scripts/materialize_source_row_admissions.py
      - name: Hydration recovery regression tests
        run: python -m unittest tests.test_hydration_recovery_contract -v
      - name: Full repository suite
        run: python -m unittest discover -s tests -v
