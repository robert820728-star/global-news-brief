name: Prepare mobile run ledger

on:
  schedule:
    # 05:58 Asia/Taipei. Taiwan does not observe daylight-saving time.
    - cron: '58 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prepare-mobile-run-ledger
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Materialize isolated ledger branch
        shell: bash
        run: |
          if git ls-remote --exit-code origin refs/heads/run-logs >/dev/null 2>&1; then
            git fetch origin run-logs
            git worktree add --detach "$RUNNER_TEMP/mobile-run-logs" origin/run-logs
          else
            git worktree add --detach "$RUNNER_TEMP/mobile-run-logs" HEAD
          fi

      - name: Rotate prior run and prepare the next executor receipt
        shell: bash
        run: |
          run_id="$(python3 scripts/run_identity.py generate)"
          updated_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          scheduled_for="$(python3 -c 'from datetime import datetime, timedelta; from zoneinfo import ZoneInfo; now=datetime.now(ZoneInfo("Asia/Taipei")); target=(now+timedelta(days=1) if now.hour>=6 else now).replace(hour=6, minute=0, second=0, microsecond=0); print(target.isoformat())')"
          python3 scripts/manage_mobile_run_log.py prepare \
            --ledger-dir "$RUNNER_TEMP/mobile-run-logs/logs" \
            --run-id "$run_id" \
            --scheduled-for "$scheduled_for" \
            --updated-at "$updated_at" \
            --execution-mode mobile-native

      - name: Commit only the two-generation ledger
        shell: bash
        run: |
          git -C "$RUNNER_TEMP/mobile-run-logs" config user.name "github-actions[bot]"
          git -C "$RUNNER_TEMP/mobile-run-logs" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$RUNNER_TEMP/mobile-run-logs" add logs
          if git -C "$RUNNER_TEMP/mobile-run-logs" diff --cached --quiet; then
            exit 0
          fi
          git -C "$RUNNER_TEMP/mobile-run-logs" commit -m "Prepare mobile scheduled-run ledger"
          git -C "$RUNNER_TEMP/mobile-run-logs" push origin HEAD:run-logs
