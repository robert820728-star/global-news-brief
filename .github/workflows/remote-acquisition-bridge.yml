name: Remote acquisition bridge

on:
  issue_comment:
    types: [created]

permissions:
  contents: write

concurrency:
  group: remote-acquisition-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  acquire:
    if: >-
      github.event.issue.number == 3 &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      contains(github.event.comment.body, '<!-- gnb-remote-acquisition:v1 -->')
    runs-on: ubuntu-latest
    steps:
      - name: Extract occurrence-pinned runtime SHA
        id: pin
        env:
          BRIDGE_COMMENT: ${{ github.event.comment.body }}
        run: |
          python - <<'PY'
          import os
          import re

          body = os.environ.get("BRIDGE_COMMENT", "")
          matches = re.findall(r'"main_sha"\s*:\s*"([0-9a-f]{40})"', body)
          if len(matches) != 1:
              raise SystemExit("bridge request must contain exactly one canonical main_sha")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write(f"main_sha={matches[0]}\n")
          PY
      - name: Checkout pinned default-branch runtime
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pin.outputs.main_sha }}
          path: runtime
      - name: Checkout durable run logs
        uses: actions/checkout@v4
        with:
          ref: run-logs
          path: runlogs
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install media dependency
        run: python -m pip install --disable-pip-version-check pillow
      - name: Compile acquisition runtime
        run: |
          python -m py_compile \
            runtime/scripts/remote_acquisition_bridge.py \
            runtime/scripts/remote_acquisition_bridge_v2.py \
            runtime/scripts/hydrate_source_rows.py \
            runtime/scripts/materialize_source_row_admissions.py
          if [ -f runtime/scripts/materialize_mobile_audit_input.py ]; then
            python -m py_compile runtime/scripts/materialize_mobile_audit_input.py
          fi
      - name: Validate issue request
        env:
          BRIDGE_COMMENT: ${{ github.event.comment.body }}
          EXPECTED_MAIN_SHA: ${{ steps.pin.outputs.main_sha }}
          PYTHONPATH: ${{ github.workspace }}/runtime
        run: >-
          python runtime/scripts/remote_acquisition_bridge_v2.py parse-comment
          --comment-env BRIDGE_COMMENT
          --expected-main-sha "$EXPECTED_MAIN_SHA"
          --output request.json
      - name: Prepare append-only hydration receipt
        env:
          EXPECTED_MAIN_SHA: ${{ steps.pin.outputs.main_sha }}
          PYTHONPATH: ${{ github.workspace }}/runtime
        run: >-
          python runtime/scripts/remote_acquisition_bridge_v2.py prepare-hydration
          --request request.json
          --expected-main-sha "$EXPECTED_MAIN_SHA"
          --run-logs-root runlogs
      - name: Prepare append-only web fallback receipt
        env:
          EXPECTED_MAIN_SHA: ${{ steps.pin.outputs.main_sha }}
          PYTHONPATH: ${{ github.workspace }}/runtime
        run: >-
          python runtime/scripts/remote_acquisition_bridge_v2.py prepare-web-fallback
          --request request.json
          --expected-main-sha "$EXPECTED_MAIN_SHA"
          --run-logs-root runlogs
      - name: Invalidate stale source-row finalization before universe expansion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          request = json.loads(Path("request.json").read_text(encoding="utf-8"))
          if request.get("operation") == "web_fallback_materialize":
              run_root = Path("runlogs/logs/runs") / request["run_id"]
              stale = [
                  run_root / "source-row-admissions.json",
                  run_root / "remote-acquisition" / "article-evidence.json",
                  run_root / "audit-input" / "manifest.json",
              ]
              for path in stale:
                  if path.exists():
                      path.unlink()
                      print(f"invalidated stale source-universe artifact: {path}")
          PY
      - name: Persist running acquisition receipt
        working-directory: runlogs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain -- logs/runs)" ]; then
            git add logs/runs
            git commit -m "Start remote hydration batch for issue comment ${{ github.event.comment.id }}"
            git pull --rebase origin run-logs
            git push origin HEAD:run-logs
          fi
      - name: Execute bounded acquisition
        env:
          EXPECTED_MAIN_SHA: ${{ steps.pin.outputs.main_sha }}
          PYTHONPATH: ${{ github.workspace }}/runtime
        run: >-
          python runtime/scripts/remote_acquisition_bridge_v2.py execute
          --request request.json
          --expected-main-sha "$EXPECTED_MAIN_SHA"
          --runtime-root runtime
          --run-logs-root runlogs
      - name: Materialize bounded mobile audit input when available
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          request = json.loads(Path("request.json").read_text(encoding="utf-8"))
          helper = Path("runtime/scripts/materialize_mobile_audit_input.py")
          run_root = Path("runlogs/logs/runs") / request["run_id"]
          admissions = run_root / "source-row-admissions.json"
          if helper.is_file() and admissions.is_file():
              remote = run_root / "remote-acquisition"
              subprocess.run([
                  sys.executable,
                  str(helper),
                  "--source-candidates", str(remote / "source-candidates.json"),
                  "--source-row-admissions", str(admissions),
                  "--content-evidence-dir", str(remote / "content-evidence"),
                  "--output-dir", str(run_root / "audit-input"),
                  "--main-sha", request["main_sha"],
                  "--timezone", "Asia/Shanghai",
              ], check=True)
          else:
              print("Pinned runtime has no audit-input helper or source scan is not terminal; skipping")
          PY
      - name: Commit run-scoped result
        working-directory: runlogs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain -- logs/runs)" ]; then
            git add logs/runs
            git commit -m "Store remote acquisition result for issue comment ${{ github.event.comment.id }}"
            git pull --rebase origin run-logs
            git push origin HEAD:run-logs
          else
            echo "No new run-scoped acquisition result to commit"
          fi
