name: Remote acquisition bridge

on:
  issue_comment:
    types: [created]

permissions:
  contents: write

concurrency:
  group: remote-acquisition-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  acquire:
    if: >-
      github.event.issue.number == 3 &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      contains(github.event.comment.body, '<!-- gnb-remote-acquisition:v1 -->')
    runs-on: ubuntu-latest
    steps:
      - name: Extract occurrence-pinned runtime SHA
        id: pin
        env:
          BRIDGE_COMMENT: ${{ github.event.comment.body }}
        run: |
          python - <<'PY'
          import os
          import re

          body = os.environ.get("BRIDGE_COMMENT", "")
          matches = re.findall(r'"main_sha"\s*:\s*"([0-9a-f]{40})"', body)
          if len(matches) != 1:
              raise SystemExit("bridge request must contain exactly one canonical main_sha")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write(f"main_sha={matches[0]}\n")
          PY
      - name: Checkout pinned default-branch runtime
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pin.outputs.main_sha }}
          path: runtime
      - name: Checkout durable run logs
        uses: actions/checkout@v4
        with:
          ref: run-logs
          path: runlogs
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install media dependency
        run: python -m pip install --disable-pip-version-check pillow
      - name: Compile acquisition runtime
        run: |
          python -m py_compile \
            runtime/scripts/remote_acquisition_bridge.py \
            runtime/scripts/remote_acquisition_bridge_v2.py \
            runtime/scripts/hydrate_source_rows.py \
            runtime/scripts/materialize_source_row_admissions.py
          if [ -f runtime/scripts/materialize_mobile_audit_input.py ]; then
            python -m py_compile runtime/scripts/materialize_mobile_audit_input.py
          fi
      - name: Validate issue request
        env:
          BRIDGE_COMMENT: ${{ github.event.comment.body }}
          EXPECTED_MAIN_SHA: ${{ steps.pin.outputs.main_sha }}
          PYTHONPATH: ${{ github.workspace }}/runtime
        run: >-
          python runtime/scripts/remote_acquisition_bridge_v2.py parse-comment
          --comment-env BRIDGE_COMMENT
          --expected-main-sha "$EXPECTED_MAIN_SHA"
          --output request.json
      - name: Detect reusable completed source scan
        id: reuse
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          request = json.loads(Path("request.json").read_text(encoding="utf-8"))
          reusable = False
          if request.get("operation") == "source_scan":
              remote = Path("runlogs/logs/runs") / request["run_id"] / "remote-acquisition"
              required = [
                  remote / "request.json",
                  remote / "receipt.json",
                  remote / "source-candidates.json",
                  remote / "source-coverage.json",
                  remote / "news-relevance-gate.json",
                  remote / "source-scans" / "cna.json",
                  remote / "source-scans" / "chinanews.json",
              ]
              present = [path.is_file() for path in required]
              if any(present) and not all(present):
                  raise SystemExit("same-run source scan is partially materialized; refuse live rescan until repaired")
              if all(present):
                  stored = json.loads((remote / "request.json").read_text(encoding="utf-8"))
                  identity_keys = ("operation", "run_id", "main_sha", "window", "source_ids")
                  if any(stored.get(key) != request.get(key) for key in identity_keys):
                      raise SystemExit("existing source-scan artifact identity conflicts with this request")
                  reusable = True
                  print("same-run source scan already materialized; reusing frozen source universe")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write(f"source_scan={'true' if reusable else 'false'}\n")
          PY
      - name: Prepare append-only hydration receipt
        env:
          EXPECTED_MAIN_SHA: ${{ steps.pin.outputs.main_sha }}
          PYTHONPATH: ${{ github.workspace }}/runtime
        run: >-
          python runtime/scripts/remote_acquisition_bridge_v2.py prepare-hydration
          --request request.json
          --expected-main-sha "$EXPECTED_MAIN_SHA"
          --run-logs-root runlogs
      - name: Prepare append-only web fallback receipt
        env:
          EXPECTED_MAIN_SHA: ${{ steps.pin.outputs.main_sha }}
          PYTHONPATH: ${{ github.workspace }}/runtime
        run: >-
          python runtime/scripts/remote_acquisition_bridge_v2.py prepare-web-fallback
          --request request.json
          --expected-main-sha "$EXPECTED_MAIN_SHA"
          --run-logs-root runlogs
      - name: Invalidate stale source-row finalization before universe expansion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          request = json.loads(Path("request.json").read_text(encoding="utf-8"))
          if request.get("operation") == "web_fallback_materialize":
              run_root = Path("runlogs/logs/runs") / request["run_id"]
              stale = [
                  run_root / "source-row-admissions.json",
                  run_root / "remote-acquisition" / "article-evidence.json",
                  run_root / "audit-input" / "manifest.json",
              ]
              for path in stale:
                  if path.exists():
                      path.unlink()
                      print(f"invalidated stale source-universe artifact: {path}")
          PY
      - name: Persist running acquisition receipt
        working-directory: runlogs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain -- logs/runs)" ]; then
            git add logs/runs
            git commit -m "Start remote hydration batch for issue comment ${{ github.event.comment.id }}"
            git pull --rebase origin run-logs
            git push origin HEAD:run-logs
          fi
      - name: Execute bounded acquisition
        if: steps.reuse.outputs.source_scan != 'true'
        env:
          EXPECTED_MAIN_SHA: ${{ steps.pin.outputs.main_sha }}
          PYTHONPATH: ${{ github.workspace }}/runtime
        run: >-
          python runtime/scripts/remote_acquisition_bridge_v2.py execute
          --request request.json
          --expected-main-sha "$EXPECTED_MAIN_SHA"
          --runtime-root runtime
          --run-logs-root runlogs
      - name: Auto-hydrate unseen rows after source-universe updates
        env:
          EXPECTED_MAIN_SHA: ${{ steps.pin.outputs.main_sha }}
          PYTHONPATH: ${{ github.workspace }}/runtime
        run: |
          python - <<'PY'
          import json
          import re
          import subprocess
          import sys
          from pathlib import Path

          request = json.loads(Path("request.json").read_text(encoding="utf-8"))
          if request.get("operation") not in {"source_scan", "web_fallback_materialize"}:
              print("request does not mutate the source universe; automatic first-pass hydration not needed")
              raise SystemExit(0)

          run_root = Path("runlogs/logs/runs") / request["run_id"]
          remote = run_root / "remote-acquisition"
          source_path = remote / "source-candidates.json"
          if not source_path.is_file():
              raise SystemExit("source candidate universe is missing after source acquisition")
          source = json.loads(source_path.read_text(encoding="utf-8"))
          rows = source.get("items")
          if not isinstance(rows, list):
              raise SystemExit("source-candidates.json has no canonical items array")

          evidence_dir = remote / "content-evidence"
          latest = {}
          max_sequence = 0
          result_re = re.compile(r"batch-(\d{4})-result\.json$")
          receipt_re = re.compile(r"batch-(\d{4})\.json$")
          if evidence_dir.is_dir():
              for path in evidence_dir.iterdir():
                  match = result_re.fullmatch(path.name) or receipt_re.fullmatch(path.name)
                  if match:
                      max_sequence = max(max_sequence, int(match.group(1)))
                  result_match = result_re.fullmatch(path.name)
                  if not result_match:
                      continue
                  value = json.loads(path.read_text(encoding="utf-8"))
                  for row in value.get("rows", []):
                      if isinstance(row, dict) and isinstance(row.get("row_id"), str):
                          latest[row["row_id"]] = row

          source_ids = [row.get("row_id") for row in rows if isinstance(row, dict)]
          if len(source_ids) != len(rows) or any(not isinstance(row_id, str) for row_id in source_ids):
              raise SystemExit("source candidate universe contains invalid row IDs")
          unseen = [row_id for row_id in source_ids if row_id not in latest]
          if not unseen:
              print("no unseen source rows require automatic first-pass hydration")
              raise SystemExit(0)

          def persist(sequence: int) -> None:
              status = subprocess.run(
                  ["git", "status", "--porcelain", "--", "logs/runs"],
                  cwd="runlogs", text=True, capture_output=True, check=True,
              ).stdout.strip()
              if not status:
                  return
              subprocess.run(["git", "add", "logs/runs"], cwd="runlogs", check=True)
              subprocess.run(
                  ["git", "commit", "-m", f"Store automatic hydration batch {sequence} for {request['run_id']}"],
                  cwd="runlogs", check=True,
              )
              subprocess.run(["git", "pull", "--rebase", "origin", "run-logs"], cwd="runlogs", check=True)
              subprocess.run(["git", "push", "origin", "HEAD:run-logs"], cwd="runlogs", check=True)

          for offset in range(0, len(unseen), 20):
              sequence = max_sequence + (offset // 20) + 1
              batch_ids = unseen[offset:offset + 20]
              hydration_request = {
                  "schema_version": "1.0",
                  "operation": "article_hydration",
                  "run_id": request["run_id"],
                  "main_sha": request["main_sha"],
                  "window": request["window"],
                  "batch_sequence": sequence,
                  "row_ids": batch_ids,
                  "fetch_overrides": {},
                  "exhausted_row_ids": [],
                  "exhaustion_evidence": {},
              }
              request_path = Path(f"auto-hydration-{sequence:04d}.json")
              request_path.write_text(
                  json.dumps(hydration_request, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )
              common = [
                  "--request", str(request_path),
                  "--expected-main-sha", request["main_sha"],
                  "--run-logs-root", "runlogs",
              ]
              subprocess.run([
                  sys.executable, "runtime/scripts/remote_acquisition_bridge_v2.py",
                  "prepare-hydration", *common,
              ], check=True)
              subprocess.run([
                  sys.executable, "runtime/scripts/remote_acquisition_bridge_v2.py",
                  "execute", *common, "--runtime-root", "runtime",
              ], check=True)
              persist(sequence)
          print(f"automatic first-pass hydration attempted {len(unseen)} unseen rows")
          PY
      - name: Materialize bounded mobile audit input when available
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          request = json.loads(Path("request.json").read_text(encoding="utf-8"))
          helper = Path("runtime/scripts/materialize_mobile_audit_input.py")
          run_root = Path("runlogs/logs/runs") / request["run_id"]
          admissions = run_root / "source-row-admissions.json"
          if helper.is_file() and admissions.is_file():
              current_path = Path("runlogs/logs/current.json")
              if not current_path.is_file():
                  raise SystemExit("mobile audit input requires a current occurrence ledger")
              current = json.loads(current_path.read_text(encoding="utf-8"))
              if current.get("run_id") != request["run_id"]:
                  raise SystemExit("mobile audit input ledger does not belong to this run")
              ledger_window = current.get("window")
              if not isinstance(ledger_window, dict):
                  raise SystemExit("mobile audit input ledger has no canonical window")
              if ledger_window.get("start") != request["window"]["start"] or ledger_window.get("end") != request["window"]["end"]:
                  raise SystemExit("mobile audit input ledger window does not match acquisition request")
              timezone_name = ledger_window.get("timezone")
              if not isinstance(timezone_name, str) or not timezone_name.strip():
                  raise SystemExit("mobile audit input ledger timezone is missing")
              remote = run_root / "remote-acquisition"
              subprocess.run([
                  sys.executable,
                  str(helper),
                  "--source-candidates", str(remote / "source-candidates.json"),
                  "--source-row-admissions", str(admissions),
                  "--content-evidence-dir", str(remote / "content-evidence"),
                  "--output-dir", str(run_root / "audit-input"),
                  "--main-sha", request["main_sha"],
                  "--timezone", timezone_name,
              ], check=True)
          else:
              print("Pinned runtime has no audit-input helper or source scan is not terminal; skipping")
          PY
      - name: Commit run-scoped result
        working-directory: runlogs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain -- logs/runs)" ]; then
            git add logs/runs
            git commit -m "Store remote acquisition result for issue comment ${{ github.event.comment.id }}"
            git pull --rebase origin run-logs
            git push origin HEAD:run-logs
          else
            echo "No new run-scoped acquisition result to commit"
