name: Remote acquisition bridge

on:
  issue_comment:
    types: [created]

permissions:
  contents: write

concurrency:
  group: remote-acquisition-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  acquire:
    if: >-
      github.event.issue.number == 3 &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      contains(github.event.comment.body, '<!-- gnb-remote-acquisition:v1 -->')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pinned default-branch runtime
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: runtime

      - name: Checkout durable run logs
        uses: actions/checkout@v4
        with:
          ref: run-logs
          path: runlogs

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install media dependency
        run: python -m pip install --disable-pip-version-check pillow

      - name: Validate issue request
        env:
          BRIDGE_COMMENT: ${{ github.event.comment.body }}
          EXPECTED_MAIN_SHA: ${{ github.sha }}
          PYTHONPATH: ${{ github.workspace }}/runtime
        run: >-
          python runtime/scripts/remote_acquisition_bridge.py parse-comment
          --comment-env BRIDGE_COMMENT
          --expected-main-sha "$EXPECTED_MAIN_SHA"
          --output request.json

      - name: Execute bounded acquisition
        env:
          EXPECTED_MAIN_SHA: ${{ github.sha }}
          PYTHONPATH: ${{ github.workspace }}/runtime
        run: >-
          python runtime/scripts/remote_acquisition_bridge.py execute
          --request request.json
          --expected-main-sha "$EXPECTED_MAIN_SHA"
          --runtime-root runtime
          --run-logs-root runlogs

      - name: Commit run-scoped result
        working-directory: runlogs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs/runs
          git commit -m "Store remote acquisition result for issue comment ${{ github.event.comment.id }}"
          git pull --rebase origin run-logs
          git push origin HEAD:run-logs
