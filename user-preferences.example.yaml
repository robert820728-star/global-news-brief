version: 4
schedule_name: 每日新聞

language:
  mode: auto
  priority:
    - explicit_user_setting
    - current_conversation_language
  fallback: 繁體中文

timezone:
  mode: auto
  priority:
    - account_or_device
    - current_workspace
  fallback: Asia/Taipei

daily_run_time: "06:00"
conversation_mode: standalone_new_chat_each_run
conversation_title: 每日新聞
content_date_heading: "YYYY/MM/DD 每日新聞"

workflow:
  orchestrator: daily-news-brief
  event_manifest_schema: schemas/news-event-manifest.schema.json
  candidate_preprocessor: scripts/preprocess_news_candidates.py
  validator: scripts/validate_news_brief.py

model_routing:
  mode: auto
  deterministic_preprocessing: true
  lightweight_model:
    enabled: optional
    provider: auto
    allowed_tasks:
      - topic_tagging
      - section_tagging
      - entity_tagging
      - merge_suggestions
    may_exclude_candidates: false
    required_for_installation: false
  high_capability_model:
    required_for:
      - major_or_uncertain_candidates
      - provisional_grading
      - semantic_deduplication
      - claim_decomposition
      - multi_source_verification
      - contradiction_analysis
      - final_editing
  mandatory_escalation:
    minimum_provisional_grade: B
    categories:
      - politics_and_elections
      - military_and_diplomacy
      - financial_markets
      - major_companies_and_technology
      - disasters_and_epidemics
      - public_safety
    low_confidence: true

sections:
  mode: default
  default:
    - name: 台灣
      code: TWN
      scope:
        - 台灣
      priority: highest
      daily_limit: 5
      minimum_grade: C-

    - name: 中國
      code: CHN
      scope:
        - 中國
      priority: high
      daily_limit: 5
      minimum_grade: C-

    - name: 世界
      code: GLB
      scope:
        - 跨國事件
        - 全球性事件
        - 未被其他板塊涵蓋的重要事件
      priority: high
      daily_limit: 8
      minimum_grade: C-

  custom_examples:
    - 日本
    - 歐盟
    - 北美
    - 非洲
    - 東南亞

topic_weights:
  public_policy: high
  economy: high
  technology: high
  international_relations: high
  public_safety: high
  disaster: highest
  epidemic: highest
  science_and_natural_history: medium_high
  entertainment: low
  industry_wide_culture_platform_games_esports: medium

deduplication:
  one_primary_section_per_event: true
  world_section_is_fallback: true
  allow_cross_section_duplicates: false
